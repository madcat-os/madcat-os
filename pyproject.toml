[project]
name = "madcat-os"
version = "0.1.0"
description = "MADCAT MCP server and CLI — stdio and Streamable HTTP transports, Typer command line"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Adam Ladachowski" }]
dependencies = [
    "mcp>=1.12",
    "typer>=0.15",
    "rich>=13.9",
    "uvicorn>=0.34",
    "starlette>=0.46",
    "pydantic>=2.10",
    "pydantic-settings>=2.8",
]

[project.scripts]
madcat = "madcat_os.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/madcat_os"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
